name: Publish PyPI

on:
  push:
    branches:
      - main

concurrency:
  group: publish-pypi-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Verify lockfile
        run: uv lock --check

      - name: Run tests
        run: uv run pytest

      - name: Run static checks
        run: |
          uv tool run ruff check .
          uv tool run ruff format --check .
          uv tool run pyrefly check

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke-test wheel
        run: >-
          uv run --python 3.14 --isolated --no-project
          --with dist/*.whl
          dependency-compat-mcp --help

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dependency-compat-mcp/
    permissions:
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
