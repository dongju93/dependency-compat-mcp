[project]
name = "dependency-compat-mcp"
version = "0.1.0"
description = "MCP server answering whether two exact package or runtime versions work together, with sources"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dongju93", email = "spdlqj011@gmail.com" }]
requires-python = ">=3.14"
keywords = [
    "mcp",
    "model-context-protocol",
    "compatibility",
    "dependencies",
    "pypi",
    "npm",
    "packaging",
    "semver",
    "version-compatibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Software Distribution",
]
dependencies = ["mcp>=2.0.0", "node-semver>=0.9.1", "packaging>=26.3"]

[project.urls]
Homepage = "https://github.com/dongju93/dependency-compat-mcp"
Repository = "https://github.com/dongju93/dependency-compat-mcp"
Issues = "https://github.com/dongju93/dependency-compat-mcp/issues"
Changelog = "https://github.com/dongju93/dependency-compat-mcp/releases"

[project.scripts]
dependency-compat-mcp = "dependency_compat_mcp:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mcp[cli]>=2.0.0", "pytest-cov>=7.1.0"]

[tool.ruff]
extend-exclude = ["docs"]
line-length = 88
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
project-excludes = [".venv"]
python-interpreter-path = ".venv/bin/python"
python-version = "3.14"
search-path = ["src", "."]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=dependency_compat_mcp",
    "--cov-report=term-missing",
]
markers = ["slow: spawns a subprocess and speaks the stdio wire protocol"]
minversion = "9.1"
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
relative_files = true
source = ["dependency_compat_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true
